[project]
name = "markdown-memory"
version = "0.1.0"
description = "AST-aware Markdown documentation indexer and hybrid retrieval MCP server for AI coding agents"
readme = "README.md"
authors = [
    { name = "Hesham Karm", email = "24391550+hishamkaram@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.8.0",
    "huggingface-hub>=0.26",
    "markdown-it-py>=4.2.0",
    "mcp[cli]>=2.2.0",
    "numpy>=1.26",
    "onnxruntime>=1.20",
    "pydantic>=2.0",
    "sqlite-vec>=0.1.9",
    "tokenizers>=0.20",
]

[project.scripts]
markdown-memory = "markdown_memory.server:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TID"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# sqlite-vec and onnxruntime ship no type information (no py.typed marker).
module = ["sqlite_vec", "onnxruntime"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy's stubs use PEP 695 `type` statements, a syntax error when checking as
# python_version 3.11. numpy is confined to the embedder (vectors cross its boundary
# as list[float]) and never appears in this package's signatures, so its stubs are skipped.
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # shared test doubles (tests/fakes.py) under any import mode
asyncio_mode = "auto"
markers = [
    "embedding: tests that load the real local ONNX embedding model",
]
