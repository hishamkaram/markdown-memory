[project]
name = "markdown-memory"
version = "0.6.0"
description = "MCP server that hands coding agents the one Markdown section that answers the question, not the whole file. Local hybrid search: BM25 keywords + ONNX embeddings in SQLite. No API keys, no network."
readme = "README.md"
authors = [
    { name = "Hesham Karm", email = "24391550+hishamkaram@users.noreply.github.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# Kept in step with the repository's GitHub topics, which are what anyone actually
# searches.
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "coding-agent",
    "ai-agents",
    "markdown",
    "documentation",
    "rag",
    "retrieval-augmented-generation",
    "hybrid-search",
    "semantic-search",
    "vector-search",
    "full-text-search",
    "bm25",
    "embeddings",
    "onnx",
    "sqlite",
    "sqlite-vec",
    "fts5",
]
classifiers = [
    # Every version CI runs, and CI runs every version listed: claiming one nothing
    # tests is how a broken install gets discovered by its first user.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]

dependencies = [
    "fastembed>=0.8.0",
    "huggingface-hub>=0.26",
    "markdown-it-py>=4.2.0",
    "mcp[cli]>=2.2.0,<3",
    "numpy>=1.26",
    "onnxruntime>=1.20",
    "pydantic>=2.0",
    "sqlite-vec>=0.1.9",
    "tokenizers>=0.20",
]

[project.urls]
Homepage = "https://github.com/hishamkaram/markdown-memory"
Repository = "https://github.com/hishamkaram/markdown-memory"
Issues = "https://github.com/hishamkaram/markdown-memory/issues"

[project.scripts]
markdown-memory = "markdown_memory.server:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TID", "ARG", "ERA", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# Test doubles and callbacks take the arguments of what they stand in for, whether or
# not this particular fake reads them.
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# sqlite-vec and onnxruntime ship no type information (no py.typed marker).
module = ["sqlite_vec", "onnxruntime"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy's stubs use PEP 695 `type` statements, a syntax error when checking as
# python_version 3.11. numpy is confined to the embedder (vectors cross its boundary
# as list[float]) and never appears in this package's signatures, so its stubs are skipped.
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "scripts"]  # test doubles (tests/fakes.py) and the scripts under test
asyncio_mode = "auto"
markers = [
    "embedding: tests that load the real local ONNX embedding model",
]
