# Publish a tagged commit of `main` to PyPI, then as a GitHub release.
#
#   uv version --bump patch   # in a PR, merged through the gate
#   git tag v0.1.1 && git push origin v0.1.1
#
# No test rerun here: only a commit already on `main` releases, and `main` takes nothing that
# did not pass `gate.yml`. PyPI accepts the upload through Trusted Publishing - a short-lived
# OIDC token for this workflow and the `pypi` environment - so no password or API token is
# stored anywhere. A release on PyPI cannot be replaced, only yanked, which is why the build
# refuses anything that does not match what it claims to be before a byte is uploaded.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7

      - name: The tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: The tag names the version being built
        run: |
          version="$(uv version --short)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi

      - name: Build, and check what PyPI will render
        run: |
          uv build
          uvx twine check --strict dist/*

      - name: The built wheel installs, runs and answers the handshake
        run: |
          uv venv /tmp/release
          VIRTUAL_ENV=/tmp/release uv pip install dist/*.whl
          /tmp/release/bin/markdown-memory --version
          uv run --no-project python scripts/handshake_check.py /tmp/release/bin/markdown-memory \
            --expect-version "$(uv version --short)"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/markdown-memory/
    permissions:
      # The only thing this job may do: ask GitHub for the token PyPI trusts. Attestations
      # are signed with the same identity, so they need nothing more.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    # After PyPI, so a GitHub release never announces a version nobody can install.
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
