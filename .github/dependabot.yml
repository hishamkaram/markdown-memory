version: 2
updates:
  # The workflow pins actions by major version, which still drifts; this is what notices.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # uv.lock is committed, so a dependency bump is a reviewable diff rather than a surprise
  # on the next resolve. Monthly: the gate takes ~10 minutes a run and nothing here moves
  # fast enough to want more.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
